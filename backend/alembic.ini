# ═══════════════════════════════════════════════════════════════════════════════
# backend/alembic.ini — основной конфиг Alembic (используется в Docker)
#
# НЕЛЬЗЯ МЕНЯТЬ: script_location — путь к env.py.
# URL БД берётся из DATABASE_URL в env.py, не отсюда.
#
# Запуск:
#   Локально:  cd backend && DATABASE_URL=... uv run alembic upgrade head
#   В Docker:  docker compose exec backend uv run alembic upgrade head
#   (deploy.sh запускает автоматически через docker compose exec)
# ═══════════════════════════════════════════════════════════════════════════════

[alembic]
# Путь относительно backend/ (WORKDIR контейнера и корень для локального запуска)
script_location = app/infrastructure/alembic

# sqlalchemy.url НЕ задаётся здесь — читается из DATABASE_URL в env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
