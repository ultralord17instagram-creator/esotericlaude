# ═══════════════════════════════════════════════════════════════════════════════
# nginx/dev.conf — Nginx для локальной разработки
#
# МОЖНО МЕНЯТЬ: server_name, порт если нужно.
# НЕЛЬЗЯ МЕНЯТЬ: proxy_pass http://backend:8000 — имя сервиса из docker-compose.
#
# Используется в docker-compose.dev.yml если добавишь nginx сервис.
# Для чистой разработки без nginx достаточно backend:8000 напрямую.
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name localhost;

    # /api/v1/* идёт напрямую на FastAPI — без прокси-слоя Next.js
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # WebSocket для Next.js HMR (hot module reload)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
