# ═══════════════════════════════════════════════════════════════════════════════
# nginx/prod.conf — Nginx для продакшна (SSL + reverse proxy)
#
# МОЖНО МЕНЯТЬ:
#   — YOUR_DOMAIN: заменить на реальный домен (в 4 местах)
#   — client_max_body_size: если нужна загрузка больших файлов
#
# НЕЛЬЗЯ МЕНЯТЬ:
#   — структуру блоков (нужна для certbot и SSL)
#   — location /.well-known/acme-challenge/ (certbot проверка домена)
#   — volume пути сертификатов
#
# Порядок деплоя с SSL (только первый раз):
#   1. Заменить YOUR_DOMAIN → реальный домен
#   2. scripts/ssl_init.sh YOUR_DOMAIN admin@email.com
#   3. docker compose -f docker-compose.prod.yml restart nginx
# ═══════════════════════════════════════════════════════════════════════════════

# Редирект HTTP → HTTPS
server {
    listen 80;
    # МОЖНО МЕНЯТЬ: заменить YOUR_DOMAIN на реальный домен
    server_name YOUR_DOMAIN;

    # Нужен для certbot при обновлении сертификата (HTTP-01 challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всё остальное → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl;
    # МОЖНО МЕНЯТЬ: заменить YOUR_DOMAIN на реальный домен
    server_name YOUR_DOMAIN;

    # SSL сертификаты от Let's Encrypt.
    # Создаются через scripts/ssl_init.sh, обновляются certbot сервисом.
    # МОЖНО МЕНЯТЬ: заменить YOUR_DOMAIN в путях к сертификатам
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Без этого Nginx режет тела запросов > 1MB
    client_max_body_size 10M;

    # /api/v1/* идёт напрямую на FastAPI — без прокси-слоя Next.js
    location /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        # frontend (Next.js): страницы + /api/tracking/*, /api/admin/*, /api/payment/checkout-start
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Поддержка Next.js hot reload (SSE для dev — не нужно в prod, но не вредит)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
