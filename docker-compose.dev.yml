# ═══════════════════════════════════════════════════════════════════════════════
# docker-compose.dev.yml — локальная разработка
#
# НЕЛЬЗЯ МЕНЯТЬ: имена сервисов (backend, postgres) — используются в скриптах.
# МОЖНО МЕНЯТЬ: порты, переменные окружения, volume пути.
#
# Запуск:
#   docker compose -f docker-compose.dev.yml up -d
#   # Затем применить миграции (один раз или после изменений схемы):
#   docker compose -f docker-compose.dev.yml exec backend uv run alembic upgrade head
# ═══════════════════════════════════════════════════════════════════════════════

services:
  backend:
    build:
      context: ./backend
    volumes:
      # Hot reload: изменения в ./backend/ видны внутри контейнера без пересборки
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      # .env.example → скопировать в .env и заполнить
      - .env
    environment:
      # DATABASE_URL переопределяем для dev: postgres — имя сервиса в этом compose
      DATABASE_URL: postgresql+asyncpg://offer_user:secret@postgres:5432/offer_db
      DEBUG: "true"
    # uvicorn с hot reload — только для разработки
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: offer_user
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: offer_db
    ports:
      # Наружу для локального alembic и psql
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offer_user -d offer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Анонимный volume — node_modules не перезаписываются host-папкой
      - frontend_node_modules:/app/node_modules
    environment:
      # BACKEND_URL переопределяем: backend — имя сервиса в этом compose
      BACKEND_URL: http://backend:8000
      NODE_ENV: development
    env_file:
      - ./frontend/.env.local
    # Пропускаем npm install если node_modules уже есть — ускоряет перезапуск
    command: sh -c "[ -d node_modules ] && echo 'node_modules OK' || npm install && npm run dev"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_dev_data:
  frontend_node_modules:
